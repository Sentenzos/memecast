<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MemeCast Broadcaster</title>
  <style>
    :root{color-scheme:dark;--ink:#11110f;--lime:#cbff4a;--purple:#7957ff;--muted:#aaa79e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(121,87,255,.24),transparent 35rem),var(--ink);color:white;font:14px/1.45 Inter,Segoe UI,sans-serif}main{width:min(920px,calc(100% - 32px));margin:0 auto;padding:34px 0 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}h1{margin:0;font-size:30px;letter-spacing:-.05em}h1 span{color:var(--lime)}.badge{padding:7px 10px;border:1px solid #34332f;border-radius:99px;color:var(--muted);font:800 10px ui-monospace,monospace}.status,.panel{border:1px solid #34332f;border-radius:18px;background:#1b1b18}.status{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:16px;padding:16px 18px}.dot{width:12px;height:12px;border-radius:50%;background:#6c6961;box-shadow:0 0 0 6px rgba(255,255,255,.04)}.dot.live{background:#ff4e78;box-shadow:0 0 0 6px rgba(255,78,120,.12)}.status strong{display:block}.status small{color:var(--muted)}.panel{padding:22px}form{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:grid;gap:6px;color:#cbc8bf;font-size:11px;font-weight:800}label.wide{grid-column:1/-1}input,select{width:100%;padding:11px 12px;border:1px solid #403f39;border-radius:9px;outline:0;background:#11110f;color:white}input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(121,87,255,.18)}.device-row{display:grid;grid-template-columns:1fr auto;gap:8px}.buttons{grid-column:1/-1;display:flex;gap:10px;margin-top:5px}button{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:900}.start{background:var(--lime);color:var(--ink)}.stop{background:#34322f;color:white}.refresh{background:var(--purple);color:white;padding:0 13px}button:disabled{opacity:.45;cursor:not-allowed}.hint{grid-column:1/-1;margin:3px 0 0;padding:13px 15px;border-left:3px solid var(--lime);background:#24231f;color:#c0bdb5;font-size:11px}.log{margin-top:16px}.log summary{cursor:pointer;color:var(--muted);font-size:11px}.log pre{max-height:220px;overflow:auto;padding:12px;background:#090908;border-radius:9px;color:#ffb5c6;font:10px/1.5 ui-monospace,monospace;white-space:pre-wrap}@media(max-width:650px){form{grid-template-columns:1fr}label.wide,.buttons,.hint{grid-column:1}.status{grid-template-columns:auto 1fr}.status .badge{grid-column:2}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main>
  <header><h1><span>MEMECAST</span> BROADCASTER</h1><div class="badge">LOCAL · 127.0.0.1</div></header>
  <section class="status"><span id="dot" class="dot"></span><div><strong id="status">Загрузка…</strong><small id="since">Локальный передатчик</small></div><span id="stateBadge" class="badge">OFFLINE</span></section>
  <section class="panel"><form id="form">
    <label>Адрес сайта MemeCast<input name="siteUrl" placeholder="https://memecast.example" required></label>
    <label>Адрес VPS для SRT<input name="publishHost" placeholder="memecast.example" required></label>
    <label>Адрес страницы стримера<input name="slug" placeholder="deadlock_otp" required></label>
    <label>OBS / Broadcaster-токен<input name="overlayToken" type="password" autocomplete="off" required></label>
    <label>Логин отправителя (не для зрителей)<input name="publishUser" autocomplete="off" required></label>
    <label>Пароль отправителя (не для зрителей)<input name="publishPassword" type="password" autocomplete="off" required></label>
    <label>SRT-пароль шифрования<input name="srtPassphrase" type="password" autocomplete="off" required></label>
    <label>Битрейт<select name="bitrateKbps"><option>96</option><option selected>128</option><option>160</option><option>192</option></select></label>
    <label class="wide">Аудиоустройство<div class="device-row"><select name="audioDevice" required><option value="">Нажмите «Обновить»</option></select><button id="devices" class="refresh" type="button">Обновить</button></div></label>
    <label>Путь к FFmpeg<input name="ffmpegPath" value="ffmpeg" required></label>
    <label>SMTC Bridge<input name="smtcUrl" value="http://127.0.0.1:5000/now-playing" required></label>
    <p class="hint">Чтобы в эфир попадала только Apple Music, направьте Apple Music на виртуальный кабель в микшере громкости Windows и выберите здесь выход этого кабеля.</p>
    <div class="buttons"><button class="start" type="submit">Начать эфир</button><button id="stop" class="stop" type="button">Остановить</button></div>
  </form><details class="log"><summary>Журнал FFmpeg</summary><pre id="log">Пока пусто</pre></details></section>
</main><script type="module">
const form=document.querySelector('#form'),statusEl=document.querySelector('#status'),dot=document.querySelector('#dot'),badge=document.querySelector('#stateBadge'),since=document.querySelector('#since'),log=document.querySelector('#log');const fields=[...form.elements].filter(x=>x.name);let savedDevice='';
async function load(){const config=await fetch('/api/config').then(r=>r.json());for(const field of fields){if(config[field.name]!==undefined)field.value=config[field.name]}savedDevice=config.audioDevice||'';await devices();await poll()}
async function devices(){const button=document.querySelector('#devices');button.disabled=true;try{const result=await fetch('/api/devices').then(r=>r.json());const select=form.elements.audioDevice;select.innerHTML='<option value="">Выберите устройство</option>';for(const device of result.devices||[]){const option=document.createElement('option');option.value=option.textContent=device;select.append(option)}if(savedDevice)select.value=savedDevice}catch{alert('Не удалось получить устройства. Проверьте FFmpeg.')}finally{button.disabled=false}}
async function poll(){try{const state=await fetch('/api/status').then(r=>r.json());statusEl.textContent=state.message;dot.classList.toggle('live',state.running);badge.textContent=state.running?'ON AIR':'OFFLINE';since.textContent=state.startedAt?`Запущено ${new Date(state.startedAt).toLocaleTimeString()}`:'Локальный передатчик';log.textContent=state.ffmpegLog||'Пока пусто'}catch{}setTimeout(poll,1000)}
form.addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));data.bitrateKbps=Number(data.bitrateKbps);savedDevice=data.audioDevice;const response=await fetch('/api/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)alert(result.error||'Не удалось запустить эфир')});
document.querySelector('#stop').onclick=()=>fetch('/api/stop',{method:'POST'});document.querySelector('#devices').onclick=devices;load();
</script></body></html>
