name: memecast

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MTX_AUTHINTERNALUSERS_0_USER: ${BROADCAST_PUBLISH_USER:?BROADCAST_PUBLISH_USER is required}
      MTX_AUTHINTERNALUSERS_0_PASS: ${BROADCAST_PUBLISH_PASSWORD:?BROADCAST_PUBLISH_PASSWORD is required}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: "~^radio/[a-z0-9_-]{3,40}$"
      MTX_PATHDEFAULTS_SRTPUBLISHPASSPHRASE: ${BROADCAST_SRT_PASSPHRASE:?BROADCAST_SRT_PASSPHRASE is required}
    ports:
      - "8890:8890/udp"
    expose:
      - "8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/memecast.sqlite
      MEDIA_ROOT: /data/media
      ENABLE_DEMO_MODE: "false"
    volumes:
      - memecast-data:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "80:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  memecast-data:
  caddy-data:
  caddy-config:
